<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ohGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" />
      <stop offset="100%" stop-color="#4834D4" />
    </linearGradient>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD32A" />
      <stop offset="100%" stop-color="#FFA801" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#ohGradient)" filter="url(#glow)" />

  <!-- Academic Mortarboard Cap Top -->
  <polygon points="32,14 54,25 32,36 10,25" fill="#FFFFFF" opacity="0.95" />
  
  <!-- Cap Lower Base -->
  <path d="M20,31.5 L20,40 C20,44.5 25.5,47.5 32,47.5 C38.5,47.5 44,44.5 44,40 L44,31.5 L32,37.5 Z" fill="#E0E7FF" />
  
  <!-- Tassel Ribbon -->
  <path d="M50,27 L50,42 C50,43.5 48.5,44.5 47,44" fill="none" stroke="#FFD32A" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="47" cy="44" r="2" fill="#FFD32A" />

  <!-- Ascending Sparkle / Star of Opportunity -->
  <path d="M32,21 L33.5,25.5 L38,27 L33.5,28.5 L32,33 L30.5,28.5 L26,27 L30.5,25.5 Z" fill="url(#starGradient)" />
</svg>
