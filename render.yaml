databases:
  - name: opportunityhub-db
    plan: free
    databaseName: opportunityhub
    user: opportunityhub

services:
  - type: web
    plan: free
    name: opportunityhub-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: opportunityhub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://opportunity-hub.vercel.app
      - key: PORT
        value: 10000
